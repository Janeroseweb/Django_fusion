{% extends 'master.html' %}
{% load static %}

{% block title %} Home {% endblock %}

{% block content %}
<div class="container">
        <h3>{{ name }}</h3>
        <p>{{ age }} years old</p>
        <p>{{ weight }} kg</p>

        {% for sub in subjects %}
            <p>{{ sub }}</p>
        {% endfor %}

        {% if isDisabled %}
           <p>has disability</p>
        {% else %}
           <p>not disabled</p>
        {% endif %}

    </div>
{% endblock %}
